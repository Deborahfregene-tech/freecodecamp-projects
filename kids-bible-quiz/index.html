<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
    <title>Bible Quiz</title>
</head>
<body>
  <main id="quiz-container">
  <div id="intro">
    <h1 id="intro-title">Bible Quiz</h1>
    <p id="intro-text">Do you want to test your Bible knowledge ? Try to answer the questions below !</p>
  </div>
 
   <header> 
   <div id="category-badge">Category Name</div>

    <div id="score-board">Score:  
    <span id="score">0</span></div>
     </header>
    <section id="question-score">
      <h2 id="question-text"> Question loads here.."</h2>
      <div id="choices-container">
        
        <button class="choice-btn">Choice 1</button>
        <button class="choice-btn">Choice 2</button>
        <button class="choice-btn">Choice 3</button>
      </div>
    </section>
    <footer>
     <p id="feedback-message"></p> 
      <button id="next-btn">Next Question</button>
    </footer>
    </main>
  <script src="script.js"></script>
</body>
